<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Gear Pattern -->
    <radialGradient id="kryptonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#39FF14" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purpleRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A820FF"/>
      <stop offset="50%" stop-color="#9300EE"/>
      <stop offset="100%" stop-color="#7900C7"/>
    </linearGradient>
    <linearGradient id="crystalFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FFF67"/>
      <stop offset="100%" stop-color="#1FE005"/>
    </linearGradient>
    <linearGradient id="crystalFace2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00BA1A"/>
    </linearGradient>
    <linearGradient id="crystalFace3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#008F28"/>
    </linearGradient>
    <filter id="kryptonDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#39FF14" flood-opacity="0.6"/>
    </filter>
    <path id="topTextArc" d="M 100,250 A 150,150 0 0,1 400,250" fill="none" />
    <path id="bottomTextArc" d="M 400,250 A 150,150 0 0,1 100,250" fill="none" />
  </defs>

  <!-- Outer Tooth / Gear Hatching Circle -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#9300EE" stroke-width="8" stroke-dasharray="2, 2.8" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#A820FF" stroke-width="2.5" />

  <!-- Outer Purple Ring -->
  <circle cx="250" cy="250" r="216" fill="none" stroke="url(#purpleRingGrad)" stroke-width="32" />
  <circle cx="250" cy="250" r="200" fill="none" stroke="#39FF14" stroke-width="1.2" stroke-opacity="0.8" />
  <circle cx="250" cy="250" r="232" fill="none" stroke="#39FF14" stroke-width="1" stroke-opacity="0.5" />

  <!-- Text Along Curve: KRYPTON on top arc -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#000000" letter-spacing="18">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      KRYPTON
    </textPath>
  </text>

  <!-- Text Along Curve: I 4 C • M H A on bottom arc -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#000000" letter-spacing="14">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      I 4 C  •  M H A
    </textPath>
  </text>

  <!-- Inner Black Disc -->
  <circle cx="250" cy="250" r="198" fill="#030503" />

  <!-- Concentric Cyber Circuit Lines & Traces (Neon Green) -->
  <g stroke="#39FF14" fill="none" stroke-width="1.6" opacity="0.85">
    <circle cx="250" cy="250" r="185" stroke-dasharray="60, 15, 25, 10, 80, 20" stroke-opacity="0.7"/>
    <circle cx="250" cy="250" r="172" stroke-dasharray="40, 20, 70, 15" stroke-opacity="0.5"/>
    <circle cx="250" cy="250" r="160" stroke-dasharray="10, 10" stroke-opacity="0.3"/>

    <!-- Circuit trace lines & nodes -->
    <path d="M 120,180 L 140,180 L 155,195" />
    <circle cx="120" cy="180" r="3" fill="#39FF14" />
    <circle cx="155" cy="195" r="2" fill="#39FF14" />

    <path d="M 380,180 L 360,180 L 345,195" />
    <circle cx="380" cy="180" r="3" fill="#39FF14" />
    <circle cx="345" cy="195" r="2" fill="#39FF14" />

    <path d="M 115,310 L 135,310 L 150,295" />
    <circle cx="115" cy="310" r="3" fill="#39FF14" />

    <path d="M 385,310 L 365,310 L 350,295" />
    <circle cx="385" cy="310" r="3" fill="#39FF14" />

    <!-- Additional micro nodes -->
    <circle cx="125" cy="240" r="2.5" fill="#39FF14" />
    <circle cx="125" cy="250" r="2.5" fill="#39FF14" />
    <circle cx="125" cy="260" r="2.5" fill="#39FF14" />

    <circle cx="375" cy="240" r="2.5" fill="#39FF14" />
    <circle cx="375" cy="250" r="2.5" fill="#39FF14" />
    <circle cx="375" cy="260" r="2.5" fill="#39FF14" />

    <!-- Top circuit ticks -->
    <line x1="240" y1="65" x2="240" y2="78" />
    <line x1="250" y1="62" x2="250" y2="78" />
    <line x1="260" y1="65" x2="260" y2="78" />
  </g>

  <!-- Green Ambient Core Glow behind crystals -->
  <circle cx="250" cy="250" r="120" fill="url(#kryptonGlow)" />

  <!-- Kryptonite Crystal Cluster (Faceted Emerald / Neon Green) -->
  <g stroke="#050805" stroke-width="2.5" stroke-linejoin="round">
    <!-- Left Crystal Spire -->
    <polygon points="175,190 200,160 215,220 185,280 170,270" fill="url(#crystalFace1)" />
    <polygon points="200,160 215,220 220,180" fill="url(#crystalFace2)" />
    <polygon points="170,270 185,280 175,320 160,290" fill="url(#crystalFace3)" />

    <!-- Far Left Crystal Points -->
    <polygon points="170,300 205,285 200,340 175,345" fill="url(#crystalFace2)" />
    <polygon points="160,250 175,220 185,260 170,270" fill="url(#crystalFace1)" />

    <!-- Center-Left Crystal Pillar -->
    <polygon points="215,150 245,120 250,210 215,220" fill="url(#crystalFace1)" />
    <polygon points="245,120 260,145 250,210" fill="url(#crystalFace3)" />

    <!-- Center-Right Crystal Spire (Tallest) -->
    <polygon points="255,140 285,125 315,170 280,225 250,210" fill="url(#crystalFace2)" />
    <polygon points="285,125 315,170 300,150" fill="url(#crystalFace1)" />

    <!-- Right Upper Crystal Pillar -->
    <polygon points="310,165 335,170 330,250 295,240" fill="url(#crystalFace3)" />
    <polygon points="310,165 325,210 295,240" fill="url(#crystalFace1)" />

    <!-- Far Right Crystal Points -->
    <polygon points="325,210 355,235 340,300 310,270" fill="url(#crystalFace2)" />
    <polygon points="325,280 340,300 350,340 320,335" fill="url(#crystalFace1)" />
    <polygon points="310,270 340,300 325,335 305,305" fill="url(#crystalFace3)" />

    <!-- Center Bottom Crystals -->
    <polygon points="200,320 240,300 245,345 205,350" fill="url(#crystalFace1)" />
    <polygon points="240,300 285,305 280,345 245,345" fill="url(#crystalFace2)" />
    <polygon points="275,290 310,295 305,340 280,345" fill="url(#crystalFace3)" />

    <!-- Central Inner Shards -->
    <polygon points="205,220 245,210 250,285 205,280" fill="url(#crystalFace2)" />
    <polygon points="245,210 290,220 285,285 250,285" fill="url(#crystalFace1)" />
  </g>

  <!-- High-Contrast Heavy Black 'K' Logo Symbol (Directly in front of crystals) -->
  <g fill="#020302" stroke="#000000" stroke-width="2">
    <!-- Vertical stem of K -->
    <path d="M 210,195 L 235,195 L 235,310 L 210,310 Z" />
    <!-- Upper right diagonal arm of K -->
    <path d="M 235,252 L 285,195 L 315,195 L 255,260 Z" />
    <!-- Lower right diagonal leg of K -->
    <path d="M 248,252 L 312,310 L 282,310 L 232,268 Z" />
  </g>

  <!-- Small Government Security Shield at Bottom Center (6 o'clock position) -->
  <g transform="translate(238, 360)">
    <!-- Shield Outline -->
    <path d="M 12,0 L 24,5 L 24,18 Q 12,28 12,30 Q 12,28 0,18 L 0,5 Z" fill="#000000" stroke="#39FF14" stroke-width="2" />
    <!-- Shield circuit node / gear icon inside -->
    <circle cx="12" cy="14" r="3.5" fill="#39FF14" />
    <line x1="12" y1="7" x2="12" y2="10.5" stroke="#39FF14" stroke-width="1.5" />
    <line x1="12" y1="17.5" x2="12" y2="22" stroke="#39FF14" stroke-width="1.5" />
    <line x1="6" y1="14" x2="8.5" y2="14" stroke="#39FF14" stroke-width="1.5" />
    <line x1="15.5" y1="14" x2="18" y2="14" stroke="#39FF14" stroke-width="1.5" />
  </g>

  <!-- Micro tech circuit dots alongside shield -->
  <g stroke="#39FF14" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M 228,375 L 205,375 L 195,385" />
    <circle cx="195" cy="385" r="2" fill="#39FF14" />
    <rect x="210" y="371" width="3" height="3" fill="#39FF14" />
    <rect x="216" y="371" width="3" height="3" fill="#39FF14" />

    <path d="M 272,375 L 295,375 L 305,385" />
    <circle cx="305" cy="385" r="2" fill="#39FF14" />
    <rect x="281" y="371" width="3" height="3" fill="#39FF14" />
    <rect x="287" y="371" width="3" height="3" fill="#39FF14" />
  </g>
</svg>
